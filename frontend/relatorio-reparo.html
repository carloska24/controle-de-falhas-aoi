<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Reparo - Controle de Falhas</title>
    <link rel="stylesheet" href="./style.css?v=1.5">
    <link rel="stylesheet" href="./react-examples/dist/output.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-header">
        <div class="app-title">Relatório de Reparo</div>
        <div class="user-info flex items-center gap-3">
            <a href="index.html" data-action="back" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border border-slate-600 text-slate-200 hover:bg-slate-700/30">Voltar</a>
            <span id="userDisplay" class="text-slate-200"></span>
            <button id="btnLogout" data-action="logout" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border border-slate-600 text-slate-200 hover:bg-slate-700/30">Sair</button>
        </div>
    </div>
    <div class="container main-layout" style="display:flex; flex-direction:row; justify-content:center; align-items:flex-start; width:100vw; min-height:80vh;">
        <section class="card" style="flex:1 1 0; max-width:1800px; width:100%; margin:32px 0;">
                        <div class="section-title-wrap" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
                            <h2 class="section-title" style="margin-bottom:0;">Registros de Reparo</h2>
                        </div>
                        <div class="toolbar" style="margin-bottom:18px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
                            <div class="filters" style="display:flex; align-items:center; gap:16px;">
                                <select id="filtroOMReparo" class="select-om" style="padding: 8px 12px; border-radius: 8px; border: 1.5px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 0.95rem; min-width:180px; max-width:320px;">
                                    <option value="">Filtrar por OM</option>
                                </select>
                            </div>
                            <div class="actions">
                                <button id="btnExportarCSVReparo" data-action="export-csv" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 21H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <span>Exportar CSV</span>
                                </button>
                            </div>
                        </div>
            <div id="reparoReportContainer" style="overflow-x:auto;">
                <div class="note">Carregando dados...</div>
            </div>
        </section>
    </div>
    <script src="./relatorio-reparo.js?v=1.0"></script>
</body>
</html>
