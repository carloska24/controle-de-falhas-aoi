<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Reparo - Controle de Falhas</title>
    
    <link rel="stylesheet" href="./style.css?v=1.5">
    <link rel="stylesheet" href="./react-examples/dist/output.css">
    <link rel="stylesheet" href="./reparo.css?v=1.9"> 
</head>
<body>

<div class="app-header">
    <div class="app-title">
        Tela de Reparo
    </div>
    <div class="user-info flex items-center gap-3">
        <a href="index.html" data-action="back" class="back-btn admin-only" style="background:transparent; border:none; box-shadow:none;" title="Voltar">
            <i data-lucide="arrow-big-left" class="w-6 h-6" style="color:#fff;"></i>
        </a>
    <span id="userDisplay" class="text-slate-200"></span>
        <button id="btnLogout" data-action="logout" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border border-slate-600 text-slate-200 hover:bg-slate-700/30">Sair</button>
    </div>
</div>

<div class="container">
    <div class="main-column">

        <section class="card">
            <h2 class="section-title">
                <i data-lucide="tool-case" class="w-6 h-6" style="color: orange;"></i>
                <span>Lista de Falhas Abertas</span>
            </h2>
            <div class="toolbar">
                <div class="right">
                    <select id="omFilter" class="search-input" style="width: auto;">
                        <option value="all">Todas as OMs</option>
                    </select>
                    <select id="statusFilter" class="search-input" style="width: auto;">
                        <option value="all">Todos</option>
                        <option value="aberto" selected>Aberto</option>
                        <option value="reparado">Reparado</option>
                    </select>
                </div>
            </div>
            <table id="reparoTable">
                <thead>
                    <tr>
                        <th style="text-align: center;">OM</th>
                        <th style="text-align: center;">Cod. Alt</th>
                        <th style="text-align: center;">Serial</th>
                        <th style="text-align: center;">Descrição</th>
                        <th style="text-align: center;">Designador</th>
                        <th style="text-align: center;">Defeito</th>
                        <th style="text-align: center;">Data/Hora</th>
                        <th style="text-align: center;">Status</th>
                        <th style="text-align: center;">Ação</th>
                    </tr>
                </thead>
                <tbody id="reparoTbody"></tbody>
            </table>
        </section>
    </div>
</div>

<div id="toastContainer"></div>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>

<script src="./reparo.js?v=1.9"></script> 
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  try { if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons(); } catch (e) { console.warn('lucide init failed', e); }
</script>
</body>
</html>
