<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relatório de Controle de Falhas</title>

  <link rel="stylesheet" href="./style.css?v=3.1"> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-title">Relatório de Controle de Falhas</div>
    <div class="user-info">
      <a href="index.html" title="Voltar" class="btn-icon" aria-label="Voltar">
        <i data-lucide="arrow-big-left"></i>
      </a>
      <button id="btnLogout" class="btn btn-neutral">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="section-title">
        <i data-lucide="book-key"></i> Relatório Completo de Registro de Falhas
      </h2>

      <div class="toolbar">
        <div class="filters">
          <select id="filtroOMFalhas"><option value="">Filtrar por OM</option></select>
          <input type="date" id="filtroDataFalhas">
          <input type="text" id="filtroOperadorFalhas" placeholder="Operador">
          <input type="text" id="filtroDefeitoFalhas" placeholder="Tipo de Defeito">
        </div>

        <div class="actions">
          <button id="btnExportarCSV" class="btn btn-emerald">⬇ Exportar CSV</button>
          <button id="btnVerGraficos" class="btn btn-sky">📊 Visualizar Gráficos</button>
        </div>
      </div>

      <div id="falhasReportContainer" class="scroll-area">
        <div class="note">Carregando dados...</div>
      </div>

      <footer id="reportFooter">
        <div id="omTimeDisplay" class="om-final-time"></div>
      </footer>
    </section>
  </main>

  <div id="graficosOverlay" class="relatorio-modal hidden" aria-hidden="true" role="dialog" aria-label="Gráficos de Falhas">
    <div class="relatorio-modal-content" role="document">
      <button id="btnFecharGraficos" class="relatorio-modal-close" aria-label="Fechar gráficos">✖</button>

      <h3 class="section-title" style="margin-bottom: 1.5rem;"><i data-lucide="bar-chart-3"></i> Análise Visual das Falhas</h3>

      <div class="grafico-container vertical">
        
        <div class="pizza-area">
          <canvas id="graficoPizzaFalhas" aria-label="Gráfico de pizza de falhas" style="max-height: 250px;"></canvas>
          <div id="legendaPizzaFalhas" class="legenda" aria-hidden="false"></div>
        </div>

        <div class="barra-area">
          <canvas id="graficoDefeitos" aria-label="Gráfico de barras de defeitos"></canvas>
        </div>

      </div>
    </div>
  </div>
  <script src="./relatorio-controle-falhas.js?v=3.1"></script>

  <script>
    // inicializa os ícones lucide (após carregar lucide)
    if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
  </script>
</body>
</html>
