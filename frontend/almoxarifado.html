<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Requisições - Almoxarifado</title>
    <link rel="stylesheet" href="./style.css?v=1.5">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-large {
            width: 80%; /* Aumenta a largura do modal */
            max-width: 950px; /* Define uma largura máxima */
        }
        /* Estilo para o input dentro da tabela do modal, para combinar com o tema */
        .input-table {
            width: 100%;
            background-color: var(--background-light);
            border: 1px solid var(--border-color);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="app-title">
        Requisições de Componentes
    </div>
    <div class="user-info flex items-center gap-3">
    <a href="index.html" data-action="back" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border border-slate-600 text-slate-200 hover:bg-slate-700/30 admin-only">Voltar ao Registro</a>
    <!-- O botão de voltar para operadores é inserido via JS -->
        <span id="userDisplay" class="text-slate-200"></span>
        <button id="btnLogout" data-action="logout" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border border-slate-600 text-slate-200 hover:bg-slate-700/30">Sair</button>
    </div>
</div>

<div class="container">
    <div class="main-column">
        <header>
            <div class="title">Requisições de Componentes</div>
        </header>

        <section class="card">
            <h2 class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 8.5C2 5 4 3.5 7 3.5H17C20 3.5 22 5 22 8.5V15.5C22 19 20 20.5 17 20.5H7" stroke="var(--primary)" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 9L13.87 11.5C12.84 12.32 11.15 12.32 10.12 11.5L7 9" stroke="var(--primary)" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 16.5H8" stroke="var(--primary)" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12.5H5" stroke="var(--primary)" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Lista de Requisições Pendentes</span>
            </h2>
            <div class="toolbar">
                <div class="left field">
                    <label for="filtroOM">Filtrar por OM:</label>
                    <select id="filtroOM"></select>
                </div>
                <div class="right">
                    <select id="filtroStatus" class="search-input" style="min-width: 180px;">
                        <option value="todos">Todos os status</option>
                        <option value="pendente">Aberto</option>
                        <option value="parcialmente_entregue">Separando</option>
                        <option value="entregue">Entregue</option>
                    </select>
                    <input class="search-input" id="buscaRequisicao" placeholder="🔎 Buscar por OM...">
                </div>
            </div>
            <table id="tabelaRequisicoes">
                <thead>
                    <tr>
                        <th class="sortable" data-key="id" style="text-align: center;">ID</th>
                        <th class="sortable" data-key="om" style="text-align: center;">OM</th>
                        <th class="sortable" data-key="created_at" style="text-align: center;">Data</th>
                        <th class="sortable" data-key="created_by" style="text-align: center;">Solicitante</th>
                        <th class="sortable" data-key="status" style="text-align: center;">Status</th>
                        <th style="text-align: center;">Requisição</th>
                        <th style="text-align: center;">Ações</th>
                        <th style="text-align: center;"></th> <!-- Coluna vazia para o botão de excluir do admin -->
                    </tr>
                </thead>
                <tbody id="tbodyRequisicoes"></tbody>
            </table>
            <div id="emptyStateAlmox" class="note" style="display:none; text-align:center; margin-top:8px;">Nenhuma requisição encontrada.</div>
        </section>
    </div>
</div>

<div id="toastContainer"></div>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>

<!-- Modal para exibir itens da requisição -->
<div id="itensModal" class="modal-overlay hidden">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2 id="modalTitle">Itens da Requisição</h2>
            <button id="closeModal" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <table id="tabelaItens">
                <thead>
                    <tr>
                        <th>OM</th>
                        <th>Cod. Alt</th>
                        <th>Descrição</th>
                        <th>Qtd. Requisitada</th>
                        <th>Qtd. Entregue</th>
                        <th>Ação Rápida</th>
                    </tr>
                </thead>
                <tbody id="tbodyItens"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button id="btnSalvarItens" data-action="save-items" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold bg-sky-700 hover:bg-sky-600 text-white">Salvar Entregas</button>
        </div>
    </div>
</div>

<script src="./almoxarifado.js?v=1.5"></script>
</body>
</html>
