<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Requisições - Almoxarifado</title>
    <link rel="stylesheet" href="./style.css?v=1.5">
        <link rel="stylesheet" href="./react-examples/dist/output.css">
        <link rel="stylesheet" href="./style.css">
        <link rel="stylesheet" href="./reparo.css?v=1.6">
    <style>
        .modal-large {
            width: 80%; /* Aumenta a largura do modal */
            max-width: 950px; /* Define uma largura máxima */
        }
        /* Estilo para o input dentro da tabela do modal, para combinar com o tema */
        .input-table {
            width: 100%;
            background-color: var(--background-light);
            border: 1px solid var(--border-color);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* */
        .notification-bell {
            position: relative;
            cursor: pointer;
            color: #cbd5e1; /* slate-300 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px; /* Espaçamento */
        }
        
        .notification-bell[data-pending="true"] {
             color: #f59e0b; /* amber-500 */
        }

        /* Animação de balanço */
        .notification-bell .lucide-bell-ring {
            animation: ring 1.5s ease-in-out infinite;
        }

        /* Ponto vermelho de notificação */
        .notification-bell[data-pending="true"]::after {
            content: '';
            position: absolute;
            top: 1px; /* Ajuste a posição do ponto */
            right: 1px; /* Ajuste a posição do ponto */
            width: 9px;
            height: 9px;
            background-color: #ef4444; /* red-500 */
            border-radius: 50%;
            border: 2px solid var(--background-dark); /* Borda para destacar do sino */
        }

        @keyframes ring {
            0%, 100% { transform: rotate(0); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(15deg); }
            20%, 40%, 60%, 80% { transform: rotate(-15deg); }
        }
        /* */

    </style>
</head>
<body>

<div class="app-header">
    <div class="app-title">
        Requisições de Componentes
    </div>
    <div class="user-info flex items-center gap-3">
        <a href="index.html" data-action="back" class="back-btn admin-only" style="background:transparent; border:none; box-shadow:none;" title="Voltar">
            <i data-lucide="arrow-big-left" class="w-6 h-6" style="color:#fff;"></i>
        </a>
        
        <div id="notificationBellContainer" class="notification-bell" title="Status das Requisições">
            <i data-lucide="bell" class="w-6 h-6"></i> </div>
        <span id="userDisplay" class="text-slate-200"></span>
        <button id="btnLogout" data-action="logout" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border border-slate-600 text-slate-200 hover:bg-slate-700/30">Sair</button>
    </div>
</div>

<div class="container">
    <div class="main-column">

        <section class="card">
            <h2 class="section-title">
                <i data-lucide="warehouse" class="w-6 h-6 text-sky-400"></i>
                <span>Lista de Requisições Pendentes</span>
            </h2>
            <div class="toolbar">
                <div class="right">
                    <select id="filtroOM" class="search-input" style="width: auto;">
                        <option value="todos">Todas as OMs</option>
                        </select>
                    
                    <select id="filtroStatus" class="search-input" style="width: auto;">
                        <option value="todos">Todos os status</option>
                        <option value="pendente">Aberto</option>
                        <option value="parcialmente_entregue">Separando</option>
                        <option value="entregue">Entregue</option>
                    </select>
                </div>
            </div>
            <table id="tabelaRequisicoes">
                <thead>
                    <tr>
                        <th class="sortable" data-key="id" style="text-align: center;">ID</th>
                        <th class="sortable" data-key="om" style="text-align: center;">OM</th>
                        <th class="sortable" data-key="created_at" style="text-align: center;">Data</th>
                        <th class="sortable" data-key="created_by" style="text-align: center;">Solicitante</th>
                        <th class="sortable" data-key="status" style="text-align: center;">Status</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyRequisicoes"></tbody>
            </table>
            <div id="emptyStateAlmox" class="note" style="display:none; text-align:center; margin-top:8px;">Nenhuma requisição encontrada.</div>
        </section>
    </div>
</div>

<div id="toastContainer"></div>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>

<div id="itensModal" class="modal-overlay hidden">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2 id="modalTitle">Itens da Requisição</h2>
            <button id="closeModal" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <table id="tabelaItens">
                <thead>
                    <tr>
                        <th>Cod. Alt</th>
                        <th>Descrição</th>
                        <th>Qtd. Requisitada</th>
                        <th>Qtd. Entregue</th>
                        <th>Ação Rápida</th>
                    </tr>
                </thead>
                <tbody id="tbodyItens"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button id="btnSalvarItens" data-action="save-items" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold bg-sky-700 hover:bg-sky-600 text-white">Salvar Entregas</button>
        </div>
    </div>
</div>

<audio id="notificationSound" src="./sounds/notification.mp3" preload="metadata"></audio>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="./almoxarifado.js?v=1.7"></script>

<script>
    try { if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons(); } catch (e) { console.warn('lucide init failed', e); }
</script>
</body>
</html>
