name: Backend tests

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Run backend tests
    runs-on: ubuntu-latest

    # Sobe um PostgreSQL temporário para os testes
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aoi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Setup database schema & seed
        run: |
          cd backend
          npx prisma db push --accept-data-loss
          node prisma/seed.js
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/aoi_test

      - name: Run backend tests
        run: |
          npm --prefix backend test -- --detectOpenHandles -i
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/aoi_test
          DEV_SEED_KEY: local-dev-2024
          JWT_SECRET: test-jwt-secret-please-change
          COOKIE_SECURE: 'false'
          PORT: 3001

